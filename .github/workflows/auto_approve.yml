name: Auto Approve Sellvia Orders Cron

on:
  schedule:
    # Runs automatically at minute 0 of every hour
    - cron: '0 * * * *'
  # Allows manual execution anytime from the GitHub Actions tab
  workflow_dispatch:

jobs:
  ping-auto-approve:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Sellvia Auto-Approve Endpoint
        run: |
          curl -X POST "https://jesse-autopilot-bridge.onrender.com/api/sellvia/auto-approve" \
            -H "Authorization: Bearer ${{ secrets.ADMIN_TOKEN }}" \
            -H "Content-Type: application/json"
